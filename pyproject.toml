[project]
name = "ai-defense-system"
version = "0.1.0"
description = "A defense layer for multi-agent AI systems (MVP v0.1)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contracts", "src/guardrail", "src/channel", "src/orchestrator"]

# ========================================
# pytest
# ========================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --strict-markers"

# ========================================
# mypy — strict type checking
# ========================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = false
warn_return_any = true
disallow_untyped_defs = true
show_error_codes = true
pretty = true

# ========================================
# ruff — linter + formatter
# ========================================
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "S101",  # allow assert in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

# ========================================
# coverage
# ========================================
[tool.coverage.run]
source = ["contracts", "guardrail", "channel", "orchestrator"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

# ========================================
# bandit
# ========================================
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
