name: Replay Cache Security Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/channel/core.py"
      - "tests/unit/channel/test_replay_cache_security.py"
      - ".github/workflows/replay-cache-security-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replay-cache-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-cache-security:
    name: Replay Cache Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Run focused replay-cache security tests
        run: uv run pytest tests/unit/channel/test_replay_cache_security.py -q
