name: Replay Cache Security Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/channel/core.py"
      - "tests/unit/channel/test_replay_cache_security.py"
      - ".github/workflows/replay-cache-security-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replay-cache-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-cache-security:
    name: Replay Cache Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint changed Python files
        run: uv run ruff check src/channel/core.py tests/unit/channel/test_core.py tests/unit/channel/test_replay_cache_security.py
      - name: Check formatting of changed Python files
        run: uv run ruff format --check src/channel/core.py tests/unit/channel/test_core.py tests/unit/channel/test_replay_cache_security.py
      - name: Run Bandit on security-critical source scope
        run: uv run bandit -r src/contracts src/guardrail src/channel src/orchestrator -q
      - name: Run full project regression suite
        run: uv run pytest --cov=src/contracts --cov=src/guardrail --cov=src/channel --cov=src/orchestrator --cov-report=term-missing --cov-fail-under=40 -q
