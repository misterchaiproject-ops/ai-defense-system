name: Auto-Update uv.lock (Virtualenv)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/audit-fail-closed-v2
          persist-credentials: true

      - name: Verify clean working tree
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: Working tree is not clean before lock update."
            git status --short
            exit 1
          fi

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Update virtualenv in uv.lock
        run: uv lock --upgrade-package virtualenv

      - name: Verify only uv.lock changed
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [ "$changed" != "uv.lock" ]; then
            echo "ERROR: Unexpected files changed:"
            git diff --name-only
            exit 1
          fi
          echo "OK: Only uv.lock changed."

      - name: Check lockfile consistency
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Verify virtualenv version
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from importlib.metadata import version
          from packaging.version import Version
          v = Version(version("virtualenv"))
          print(f"virtualenv={v}")
          if v < Version("21.14.7"):
              raise SystemExit("ERROR: virtualenv is below 21.14.7")
          PY

      - name: Run pip-audit
        run: uv run pip-audit

      - name: Show diff
        run: git diff -- uv.lock

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: update virtualenv to resolve CVE-2026-113726/113725"
          git push origin fix/audit-fail-closed-v2
