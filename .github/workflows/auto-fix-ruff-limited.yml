name: Auto-Fix Ruff (Limited)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/audit-fail-closed-v2
          persist-credentials: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run Ruff check --fix
        run: |
          uv run ruff check --fix \
            src/channel/core.py \
            src/channel/exceptions.py \
            tests/unit/channel/test_audit_fail_open.py

      - name: Run Ruff format
        run: |
          uv run ruff format \
            src/channel/core.py \
            src/channel/exceptions.py \
            tests/unit/channel/test_audit_fail_open.py

      - name: Verify only authorized files changed
        run: |
          set -euo pipefail

          for file in $(git diff --name-only); do
            case "$file" in
              src/channel/core.py|\
              src/channel/exceptions.py|\
              tests/unit/channel/test_audit_fail_open.py)
                ;;
              *)
                echo "ERROR: Unauthorized file changed: $file"
                exit 1
                ;;
            esac
          done

          echo "OK: Only authorized files changed."

      - name: Verify Ruff
        run: |
          uv run ruff check \
            src/channel/core.py \
            src/channel/exceptions.py \
            tests/unit/channel/test_audit_fail_open.py

          uv run ruff format --check \
            src/channel/core.py \
            src/channel/exceptions.py \
            tests/unit/channel/test_audit_fail_open.py

      - name: Show diff
        run: git diff -- src/channel/core.py src/channel/exceptions.py tests/unit/channel/test_audit_fail_open.py

      - name: Commit and push
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            src/channel/core.py \
            src/channel/exceptions.py \
            tests/unit/channel/test_audit_fail_open.py

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "style: auto-fix ruff issues in target files"
          git push origin fix/audit-fail-closed-v2
