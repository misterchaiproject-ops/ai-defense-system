name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen

      # 1. Type Checking (Mypy) - إضافة audit و doctor
      - name: mypy --strict
        run: uv run mypy src/contracts src/guardrail src/channel src/orchestrator src/audit src/doctor tests

      # 2. Linting & Formatting (Ruff)
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .

      # 3. Security Analysis (Bandit) - إضافة audit و doctor
      - name: bandit
        run: uv run bandit -r src/contracts src/guardrail src/channel src/orchestrator src/audit src/doctor -q

      # 4. Dependency Audit (pip-audit) - خطوة جديدة
      - name: pip-audit
        run: uv run pip-audit

      # 5. Tests & Coverage (Pytest) - رفع التغطية إلى 80% وإضافة audit و doctor
      - name: pytest
        run: uv run pytest --cov=src/contracts --cov=src/guardrail --cov=src/channel --cov=src/orchestrator --cov=src/audit --cov=src/doctor --cov-report=term-missing --cov-fail-under=80 -v
